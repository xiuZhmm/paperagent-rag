[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperagent-rag"
version = "0.1.0"
description = "PDF-grounded RAG assistant with citation-aware answers and PPT generation"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "pymupdf>=1.24",
  "numpy>=1.24",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "openai>=1.35",
  "python-pptx>=0.6.23",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

